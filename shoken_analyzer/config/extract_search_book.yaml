# ============================================================
# 検索データExcel（1店舗=1ブック）の読み取り定義
#
# 想定する構成（サンプル: Hanakoganei_Market_Research.xlsx）
#   商圏サマリー  : 項目 / 詳細情報 / 備考 の縦持ち
#   競合店一覧    : 1行1店。業態の列を数えて件数にする
#   周辺施設一覧  : 1行1施設。カテゴリーの列を数えて件数にする
#
# シート名・見出しは前方一致ではなく「含まれていれば一致」で見る。
# 表記が違う場合はここに別名を足してください。
# ============================================================

summary:
  sheet_names: ["商圏サマリー", "サマリー", "概要", "店舗概要"]
  key_header:   ["項目", "区分"]
  value_header: ["詳細情報", "内容", "詳細", "値"]
  note_header:  ["備考", "メモ"]
  # 内部key: 行見出しの別名
  fields:
    store_name:          ["店舗名", "店名"]
    address:             ["所在地", "住所"]
    nearest_station:     ["最寄り駅", "最寄駅"]
    station_daily_users: ["駅乗降客数", "乗降客数", "乗降人員"]
    parking_spaces:      ["駐車場"]
    open_date:           ["オープン日", "開店日", "改装オープン", "開業日"]
    sales_floor_sqm:     ["売場面積", "売り場面積"]
    store_format:        ["業態"]
    # 軸3（移動手段）はこの4つが無いと丸ごと空になる。
    # 検索では出てこないので、店頭観察か自社調査の結果を書き足す。
    # 「35%」でも「0.35」でも読める。全店で同じ方法で埋めること。
    share_walk:          ["来店手段 徒歩", "徒歩比率", "徒歩構成比"]
    share_bike:          ["来店手段 自転車", "自転車比率", "自転車構成比"]
    share_car:           ["来店手段 車", "車比率", "自動車比率", "車構成比"]
    share_train:         ["来店手段 鉄道", "鉄道比率", "電車比率", "鉄道構成比"]
    nearest_comp_name:   ["最寄競合の店名", "最寄競合店名"]
    nearest_comp_m:      ["最寄競合までの距離", "最寄競合距離"]
    nearest_comp_price:  ["最寄競合の価格帯", "競合価格帯"]
  # 徒歩時間から駅距離(m)を見積もる行。不動産表示規約の 1分=80m を使う。
  walk_field: ["アクセス（徒歩）", "アクセス(徒歩)", "徒歩"]
  walk_meters_per_minute: 80

lists:
  - name: 競合店
    sheet_names: ["競合店一覧", "競合一覧", "競合"]
    category_header: ["業態", "カテゴリー", "区分", "種別"]
    counts:
      comp_sm_1km:       ["スーパーマーケット", "スーパー", "ＳＭ", "SM", "食品スーパー"]
      comp_drug_1km:     ["ドラッグ", "薬局"]
      comp_cvs_1km:      ["コンビニ", "CVS"]
      comp_discount_1km: ["ディスカウント", "業務スーパー", "ドン・キホーテ", "ドンキ"]
  - name: 周辺施設
    sheet_names: ["周辺施設一覧", "周辺施設", "施設一覧", "施設"]
    category_header: ["カテゴリー", "区分", "種別", "分類"]
    counts:
      fac_school:     ["小学校", "中学校", "学校"]
      fac_nursery:    ["保育", "幼稚園", "こども園", "認定こども園"]
      fac_university: ["大学", "専門学校"]
      fac_hospital:   ["病院", "医療"]
      fac_factory:    ["工場"]

# 数えた件数がどの半径のものかは、ブック側の備考に書かれていることが多い。
# 既存店と新店で半径が揃っていないと比較が壊れるので、読み取り後に必ず表示する。
radius_note_keys: ["競合店数", "周辺施設数"]
