# ============================================================
# 予測対象（低温カテゴリー）と指標の定義
# 実データの列名・カテゴリ名が違う場合は source / aliases を書き換える
# ============================================================

meta:
  version: "0.2.0"
  # PI値の定義。実データの定義と違う場合はここを書き換える（計算式ではなく注記）
  # 実データのPI値の定義に合わせて書き換えてください。レポートにそのまま表示されます。
  pi_definition: "PI値（IDPOS出力の定義どおり。本ツールは単位を仮定せず、そのまま集計しています）"
  scope_note: "低温（和日配・洋日配・フローズン・精肉・パン）のみを対象とする"

# ---- 予測対象カテゴリー ----
# aliases: 実データでの表記ゆれをここに並べると自動で寄せる
target_categories:
  - key: wa_nichihai
    name: 和日配
    aliases: ["和日配", "和日配品", "日配和", "豆腐・納豆", "和日配計"]
  - key: yo_nichihai
    name: 洋日配
    aliases: ["洋日配", "洋日配品", "日配洋", "ヨーグルト・デザート", "洋日配計"]
  - key: frozen
    name: フローズン
    aliases: ["フローズン", "冷凍食品", "冷食", "フローズン計", "冷凍"]
  - key: seiniku
    name: 精肉
    aliases: ["精肉", "食肉", "精肉計", "ミート"]
  - key: pan
    name: パン
    aliases: ["パン", "ベーカリー", "日配パン", "パン計", "インストアベーカリー"]

# ---- 予測する指標 ----
# 数量PI = 買上率 × 1人当たり点数 × 1000 に分解できる（恒等式）。
# 分解して見ると、PIが低い原因が「手に取られていない」のか
# 「買う人は買うが量が少ない」のかが分かれるので、打ち手が変わる。
metrics:
  - key: pi
    source: pi
    label: 数量PI値
    kind: pi
    required: true
    higher_is_better: true
    digits: 2
  - key: gross_margin_rate
    source: gross_margin_rate
    label: 粗利率
    kind: rate
    required: false
    higher_is_better: true
    digits: 3

derived_metrics:
  # --- PIの分解（どちらも客数で割るので店舗規模に依存しない） ---
  - key: buy_rate
    label: 買上率
    kind: ratio
    digits: 4
    note: "この単位を買った客数 ÷ 店全体の客数。低い＝そもそも手に取られていない。"
  - key: units_per_buyer
    label: 1人当たり点数
    kind: ratio
    digits: 3
    note: "売上数量 ÷ 買った客数。低い＝買う人はいるが量が出ていない。"
  - key: unit_price
    label: 平均単価(円)
    kind: ratio
    digits: 0
    note: "売上税抜金額 ÷ 売上数量。"

  # --- 粗利（客数は数量とPI値から逆算できるので、別ファイルは不要） ---
  - key: amount_pi
    label: 金額PI値
    kind: per_customer
    digits: 1
    source_numerator: sales_amount
    note: "売上 ÷ 店全体の客数 × 1000。"
  - key: gp_pi
    label: 粗利PI値
    kind: per_customer
    digits: 2
    source_numerator: gross_profit
    note: "粗利額 ÷ 店全体の客数 × 1000。粗利向上の主指標。"

  # --- 低温内での配分（棚割に直結） ---
  - key: gp_share
    label: 粗利額構成比(低温内)
    kind: share_within_scope
    digits: 4
    note: "その単位の粗利額 ÷ 低温全体の粗利額。"
  - key: sales_share
    label: 売上構成比(低温内)
    kind: share_within_scope
    digits: 4
    note: "その単位の売上 ÷ 低温全体の売上。"

# ---- 週次IDPOSの読み込み（実データ2ファイル構成） ----
# IDPOS____.csv      : 年代別のPI値・売上（顧客層の実測値がここにある）
# URE_ZAIKO____.csv  : 販売荒利高・販売荒利率（年代の内訳は無い）
# 2つを 年週 × 店舗CD × ライン で突き合わせる。
idpos:
  encoding: cp932            # 実データはShift-JIS。utf-8ならここを utf-8-sig に
  # 集計粒度。line / department / category / subcategory / segment から選ぶ
  # 階層は ディビジョン > ライン > 部門 > カテゴリー > サブカテゴリー > セグメント
  level: category
  division_filter: ["低温"]  # このディビジョンだけを対象にする
  age_unknown_labels: ["不明", "無し", "未設定", "-", ""]

  # 小計・合計行の見出し。これらが顧客種類・年代・階層のどれかに入っている行は
  # 明細と二重計上になるため捨てる。1本に年代と数量が同居する形式では特に危険。
  total_row_labels: ["計", "合計", "総計", "小計", "全体", "TOTAL", "Total", "total", "ALL", "―", "—"]
  customer_type_for_age: "会員"   # 年代構成の算出に使う顧客種類。空にすると全件

  # PI値は数量ベース（客1000人あたりの販売点数）。
  #   数量PI = 売上数量 ÷ 店全体の客数 × 1000
  # この式を逆に使って、店全体の客数を 売上数量 ÷ PI値 × 1000 で復元する。
  # 客数ファイルは不要。復元値が行ごとにばらつく場合は警告を出す。
  pi_kind: quantity
  derive_customers_from_pi: true

  # 開店・改装オープン直後の週は需要が跳ねるので、水準の計算から外す。
  # 商圏マスタの open_date 列（YYYY-MM-DD）を見て店舗ごとに判定する。
  # open_date が空の店舗は除外しない。
  exclude_opening_weeks: 8

  # 任意: 客数を別ファイルで持っている場合。通常は derive_customers_from_pi で足りる。
  customers_file:
    columns:
      store_code: "店舗CD"
      year_week:  "年週"
      customers:  "レジ通過客数"

  pi_file:
    columns:
      year_week:     "年週"
      store_code:    "店舗CD"
      store_name:    "店舗"
      division:      "ディビジョン"
      line:          "ライン"
      department:    "部門"
      category:      "カテゴリー"
      subcategory:   "サブカテゴリー"
      segment:       "セグメント"
      customer_type: "顧客種類"
      age_band:      "年代"          # 年代別エクスポートにのみ存在
      quantity:      "売上数量"       # 数量・客数つきエクスポートにのみ存在
      sales_amount:  "売上税抜金額(円)"
      pos_customers: "POS客数"
      id_customers:  "ID客数"
      pi:            "PI値"

  margin_file:
    columns:
      year_week:         "年週"
      store_code:        "店舗CD"
      store_name:        "店舗名"
      division:          "ディビジョン名"
      line:              "ライン名"
      department:        "部門名"
      category:          "カテゴリー名"
      subcategory:       "サブカテゴリー名"
      segment:           "セグメント名"
      gross_profit:      "販売荒利高(千円)"
      gross_margin_rate: "販売荒利率"
    gross_profit_scale: 1000     # 千円 -> 円

  min_weeks: 8                   # これ未満の店舗×ラインは水準を信用しない
  trim_ratio: 0.10               # 上下10%の週を落として平均（棚卸・祝祭週の除去）
  seasonality: month             # 季節性は月単位で指数化（年週からISO週の月曜で判定）

# ---- 予測と検証 ----
prediction:
  top_n_peers: 2
  # 類似度をそのまま重みにすると差がつきにくいので、この指数で強調する
  similarity_power: 2.0
  # 予測区間は LOO の誤差分布から作る（分位点）
  interval_quantile: 0.80
  # LOO で全店平均（ベースライン）に勝てない指標は、レポートで明示して警告する
  warn_if_worse_than_baseline: true

# ---- 苦戦カテゴリーの判定ルール ----
risk:
  low_vs_median_pct: -8.0     # 予測が既存5店の中央値をこの%以上下回る
  wide_interval_pct: 25.0     # 予測区間の幅が点推定比この%を超える = 読めない
  loo_mape_poor: 12.0         # LOO MAPEがこの%を超える指標は信用度を下げる
  weekly_cv_high: 0.18        # 週次変動係数がこれを超える = そもそも週単位で安定しない
  gp_pi_low_rank: 2           # 粗利PIが5店中この順位以下 = 粗利貢献が小さい

# ---- 予実検証（開店後） ----
verification:
  min_weeks_for_judgement: 4   # これ未満の週数では「判定保留」にする
  exclude_first_weeks: 2       # 開店直後のご祝儀需要を判定から除く週数
  # 実績が予測区間の外に出ても、週次ノイズの範囲内なら「想定内」とする
  noise_sigma: 2.0
